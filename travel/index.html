<!DOCTYPE html>

<meta charset="utf-8" />
<title>My Travel Map</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
  html,body,#map {height:100%;margin:0;}
  .legend{
    background:#fff;
    padding:6px 8px;
    border-radius:4px;
    font:14px/18px sans-serif;
    box-shadow:0 0 4px rgba(0,0,0,.15);
  }
  .leaflet-tile {
    image-rendering: pixelated;
  }

  #map {
    background-color: #ccc; /* optional for visual continuity */
  }
</style>
</head>

/* ──────────────────────────────────────────────────────────────────── */

/* 2.  Minimal Leaflet set-up */
const map = L.map('map').setView([20,0], 2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap contributors",
  detectRetina: true,
  noWrap: true,  // prevent horizontal repetition
  continuousWorld: false,  // deprecated, replaced by noWrap
  tileSize: 256,
  edgeBufferTiles: 2  // optional: buffers to avoid flickering or seams
}).addTo(map);

/* 3.  Fetch world-atlas TopoJSON and convert to GeoJSON */
import { feature } from "https://unpkg.com/topojson-client@3?module";

/* 3. Fetch world GeoJSON */
// Using the new URL you provided (which is GeoJSON, not TopoJSON)
const geoUrl = "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

const geo = await fetch(geoUrl).then(r => r.json());

// Note: You can now remove the import { feature } from "topojson-client" line entirely.

/* 4. Filter and Render */
const filteredGeo = {
  type: "FeatureCollection",
  features: geo.features.filter(f => {
    // Note: Some GeoJSONs use f.properties.ADMIN or f.properties.name
    const name = (f.properties.name || f.properties.ADMIN)?.toLowerCase();
    if (!name) return false;
    return true;
  })
};

L.geoJSON(filteredGeo, {
  // CRITICAL: This fixes the horizontal black lines (Antimeridian issue)
  coordsToLatLng: function(coords) {
    let lng = coords[0];
    let lat = coords[1];
    return L.latLng(lat, lng); 
  },
  style: f => {
    const name = (f.properties.name || f.properties.ADMIN).toLowerCase();
    const chosen = visited.includes(name);
    return {
      color: "#222",
      weight: 0.7,
      fillOpacity: chosen ? 0.75 : 0.05,
      fillColor: chosen ? "#e44" : "#ccc"
    };
  },
  onEachFeature: (f, layer) => {
    const name = f.properties.name || f.properties.ADMIN;
    if (visited.includes(name.toLowerCase())) {
      layer.bindPopup(`<strong>${name}</strong>`);
    }
  }
}).addTo(map);


/* 5. Add Legend */
const LegendControl = L.Control.extend({
  options: {
    position: "bottomleft"
  },
  onAdd: function() {
    const d = L.DomUtil.create("div", "legend");
    d.innerHTML = `<span style="background:#e44;display:inline-block;width:12px;height:12px"></span> Visited`;
    return d;
  }
});

// Create and add the instance
new LegendControl().addTo(map);
