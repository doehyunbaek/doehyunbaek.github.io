    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 20, lng: 0 },
        zoom: 2,
        mapTypeId: "roadmap"
      });

      map.data.loadGeoJson("countries.geojson");

      map.data.setStyle(feature => {
        const name = (feature.getProperty("name") || "").toLowerCase();
        const chosen = visited.includes(name);

        return {
          clickable: chosen,
          fillColor: chosen ? "#e44" : "#ccc",
          fillOpacity: chosen ? 0.75 : 0.05,
          strokeColor: "#222",
          strokeOpacity: 1,
          strokeWeight: 0.7
        };
      });

      const infoWindow = new google.maps.InfoWindow();
      map.data.addListener("click", event => {
        const name = event.feature.getProperty("name");
        if (!name || !visited.includes(name.toLowerCase())) return;

        infoWindow.setContent(`<strong>${name}</strong>`);
        infoWindow.setPosition(event.latLng);
        infoWindow.open({ map });
      });

      const legend = document.createElement("div");
      legend.className = "legend";
      legend.innerHTML = '<span class="legend-swatch"></span> Visited';
      map.controls[google.maps.ControlPosition.LEFT_BOTTOM].push(legend);
    }

    async function loadGoogleMaps() {
      let region = "US";

      try {
        const response = await fetch("https://ipapi.co/json/");
        if (response.ok) {
          const data = await response.json();
          if (data.country_code) region = data.country_code;
        }
      } catch (error) {
        console.warn("IP lookup failed; using the default map region.", error);
      }

      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyDyqMZHQwTEaHclC9ZndrWmUI2k5y_baFs&region=${encodeURIComponent(region)}&callback=initMap`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    loadGoogleMaps();
  </script>
